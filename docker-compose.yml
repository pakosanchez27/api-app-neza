services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: api_explora_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - api_usuarios

  nginx:
    image: nginx:alpine
    container_name: api_explora_nginx
    restart: unless-stopped
    ports:
      - "8085:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - api_usuarios

networks:
  api_usuarios:
    driver: bridge